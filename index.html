<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasatria - 3D Periodic Table</title>
    <link rel="stylesheet" href="index.css?v=1.2">

    <!-- Three.js and Extensions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TrackballControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <!-- Login Screen Container -->
    <div id="login-container">
        <div class="login-box">
            <h2>Welcome Back</h2>
            <p>Please sign in with your Google account</p>

            <!-- Google Sign-In Button -->
            <div id="g_id_onload"
                data-client_id="457265073801-9getok6g5ms8qpkkj3baamk98v7iddgt.apps.googleusercontent.com"
                data-callback="handleCredentialResponse" data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left">
            </div>
        </div>
    </div>

    <!-- 3D Visualization Container (Shown after Login) -->
    <div id="visualization-container" style="display: none;">
        <!-- Top Bar with User Info & Logout -->
        <div id="top-bar">
            <div id="user-info">
                <img id="user-avatar" src="" alt="Avatar" style="display: none;">
                <span id="user-name"></span>
            </div>
            <button id="logout-btn" onclick="logout()">Sign Out</button>
        </div>

        <!-- 3D Canvas Container -->
        <div id="container"></div>

        <!-- Legend -->
        <div id="legend">
            <div><span class="dot dot-red"></span> Red: &lt; $100K</div>
            <div><span class="dot dot-orange"></span> Orange: $100K - $200K</div>
            <div><span class="dot dot-green"></span> Green: &gt; $200K</div>
        </div>

        <!-- Layout Switcher Menu -->
        <div id="menu">
            <button id="table">TABLE</button>
            <button id="sphere">SPHERE</button>
            <button id="helix">HELIX</button>
            <button id="grid">GRID</button>
            <button id="pyramid">PYRAMID</button>
        </div>
    </div>

    <script src="index.js?v=1.2"></script>
</body>

</html>
